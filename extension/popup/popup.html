<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save YouTube Bookmark</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1 data-i18n="popup.title">📚 YouTube Bookmarks</h1>
    </header>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p data-i18n="popup.loading">Завантаження інформації про відео...</p>
    </div>

    <div id="error" class="error hidden">
      <p id="errorMessage"></p>
      <p class="error-hint" data-i18n="popup.errorHint">Ви можете переглянути збережені закладки через кнопку "Збережене" внизу.</p>
    </div>

    <div id="mainContent" class="hidden">
      <!-- Video Info Preview -->
      <div class="video-info">
        <h3 id="videoTitle">Назва відео</h3>
        <p class="video-meta">
          <span id="videoChannel">Канал</span> •
          <span id="videoTime">0:00</span>
        </p>
      </div>

      <!-- Bookmark Form -->
      <form id="bookmarkForm">
        <!-- Theme Selection -->
        <div class="form-group">
          <label for="themeSelect" data-i18n="popup.themeLabel">Тема:</label>
          <div class="theme-input-group">
            <select id="themeSelect" required>
              <option value="" data-i18n="popup.themeSelectPlaceholder">Виберіть тему...</option>
            </select>
            <button type="button" id="addThemeBtn" class="btn-icon" data-i18n="popup.themeAddButton" data-i18n-attr="title" title="Додати нову тему">+</button>
          </div>
        </div>

        <!-- New Theme Input (hidden by default) -->
        <div id="newThemeGroup" class="form-group hidden">
          <label for="newThemeInput" data-i18n="popup.newThemeLabel">Нова тема:</label>
          <div class="theme-input-group">
            <input type="text" id="newThemeInput" data-i18n="popup.newThemePlaceholder" data-i18n-attr="placeholder" placeholder="Введіть назву теми...">
            <button type="button" id="addNewThemeBtn" class="btn btn-primary btn-small" data-i18n="popup.themeAddBtn" title="Додати тему">Додати</button>
            <button type="button" id="cancelThemeBtn" class="btn-icon" data-i18n="popup.themeCancelBtn" data-i18n-attr="title" title="Скасувати">×</button>
          </div>
        </div>

        <!-- Timestamp Display -->
        <div class="form-group">
          <label data-i18n="popup.currentTimeLabel">Поточний час:</label>
          <div class="timestamp-display">
            <span id="currentTimestamp">0:00</span>
            <span class="timestamp-seconds" id="currentTimestampSeconds">(0 <span data-i18n="popup.seconds">сек</span>)</span>
          </div>
        </div>

        <!-- Description -->
        <div class="form-group">
          <label for="description" data-i18n="popup.descriptionLabel">Опис:</label>
          <textarea
            id="description"
            rows="3"
            data-i18n="popup.descriptionPlaceholder"
            data-i18n-attr="placeholder"
            placeholder="Додайте опис того, що зберігаєте..."
            maxlength="500"
          ></textarea>
          <div class="char-counter">
            <span id="charCount">0</span>/500
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="button-group">
          <button type="button" id="cancelBtn" class="btn btn-secondary" data-i18n="popup.cancelButton">Скасувати</button>
          <button type="submit" id="saveBtn" class="btn btn-primary" data-i18n="popup.saveButton">Зберегти</button>
        </div>
      </form>

      <!-- Status Message -->
      <div id="statusMessage" class="status-message hidden"></div>
    </div>

    <!-- Footer Links -->
    <div class="footer">
      <a href="#" id="viewBookmarksBtn" class="footer-link" data-i18n="popup.viewBookmarks">📖 Збережене</a>
      <a href="#" id="settingsLink" class="footer-link" data-i18n="popup.settings">⚙️ Налаштування</a>
    </div>
  </div>

  <script src="../utils/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
